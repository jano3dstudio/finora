<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>FINORA</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="kit/tokens.css"><link rel="stylesheet" href="kit/jano.css"><link rel="stylesheet" href="kit/looks.css"><link rel="stylesheet" href="app.css"></head>
<body class="jano">
<header class="j-topbar"><div class="j-brand"><img src="icon.svg" width="38" height="38" alt=""><div><h1>FINORA <small>0.1</small></h1><p class="j-muted" data-t="subtitle"></p></div></div><div class="j-row"><button class="j-btn" id="templatesOpen" data-t="templates"></button><button class="j-btn" id="lookOpen" data-t="interface"></button><select id="language" class="j-input" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option></select></div></header>
<main>
<aside class="film"><div class="film-head"><span class="j-label" data-t="series"></span><span id="count">0</span></div><button id="import" class="j-btn j-btn-primary" data-t="add"></button><input id="files" type="file" accept="image/jpeg,image/png" multiple hidden><div class="j-row selection"><button class="j-btn j-btn-quiet" id="selectAll" data-t="all"></button><button class="j-btn j-btn-quiet" id="remove" data-t="remove"></button></div><div id="images" role="list" aria-label="Renderings"></div><p class="j-muted film-note" data-t="originals"></p></aside>
<section class="workspace"><div class="preview-head"><div><span class="j-label" data-t="preview"></span><h2 id="imageName" data-t="emptyTitle"></h2><small id="dimensions"></small></div><label class="j-check"><input type="checkbox" id="before"><span data-t="before"></span></label></div><div id="stage" tabindex="0"><div id="empty"><svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true"><rect x="9" y="9" width="54" height="54" rx="8" stroke="currentColor" stroke-width="2"/><path d="m10 52 17-19 13 12 10-11 13 16M45 23h9m-4-4v9" stroke="currentColor" stroke-width="2"/></svg><h2 data-t="dropTitle"></h2><p data-t="dropHint"></p><button class="j-btn" id="emptyImport" data-t="add"></button></div><canvas id="preview" hidden></canvas></div><div class="preview-foot"><span id="previewHint" data-t="previewHint"></span><button class="j-btn j-btn-quiet" id="resetSingle" data-t="resetSingle"></button></div><div class="looks" id="lookCards"></div><div class="export-strip"><span id="selectedCount"></span><button class="j-btn j-btn-primary" id="exportOpen" data-t="export"></button></div></section>
<aside class="inspector"><div class="tabs"><button class="j-btn" data-tab="image" aria-pressed="true" data-t="image"></button><button class="j-btn" data-tab="brand" aria-pressed="false" data-t="brand"></button></div><section id="imagePanel"><div class="section-head"><h2 data-t="adjust"></h2><button id="reset" class="j-btn j-btn-quiet" data-t="reset"></button></div><label class="j-field"><span data-t="scope"></span><select id="scope" class="j-input"><option value="all" data-t="scopeAll"></option><option value="single" data-t="scopeSingle"></option></select></label><p class="j-note" id="scopeHint" data-t="scopeHint"></p><div id="sliders"></div><label class="j-field"><span data-t="autoMode"></span><select id="autoMode" class="j-input"><option value="individual" data-t="autoIndividual"></option><option value="series" data-t="autoSeries"></option></select></label><div class="divider"></div><label class="j-field"><span data-t="lookIntensity"></span><input id="intensity" type="range" min="0" max="100" value="75"><output id="intensityValue">75%</output></label><button id="lutImport" class="j-btn" data-t="lutImport"></button><input id="lutFile" type="file" accept=".cube" hidden><small id="lutName" data-t="lutHint"></small></section>
<section id="brandPanel" hidden><h2 data-t="logo"></h2><div class="j-row"><button id="logoImport" class="j-btn" data-t="logoImport"></button><button id="logoRemove" class="j-btn j-btn-quiet" data-t="remove"></button></div><input id="logoFile" type="file" accept="image/png" hidden><small id="logoName"></small><div id="logoControls"></div><div class="divider"></div><h2 data-t="text"></h2><label class="j-field"><span data-t="caption"></span><textarea id="caption" class="j-input" rows="2" maxlength="300"></textarea></label><div class="pair"><label class="j-field"><span data-t="font"></span><select id="font" class="j-input"><option>Segoe UI</option><option>Arial</option><option>Georgia</option><option>Consolas</option></select></label><label class="j-field"><span data-t="color"></span><input id="textColor" type="color" value="#ffffff" class="j-input"></label></div><label class="j-check"><input id="bold" type="checkbox"><span data-t="bold"></span></label><div id="textControls"></div><div class="divider"></div><h2 data-t="decoration"></h2><label class="j-field"><span data-t="shape"></span><select id="shape" class="j-input"><option value="none" data-t="none"></option><option value="bar" data-t="bar"></option><option value="frame" data-t="frame"></option><option value="line" data-t="line"></option><option value="grid" data-t="grid"></option><option value="dots" data-t="dots"></option></select></label><div class="pair"><label class="j-field"><span data-t="color"></span><input id="shapeColor" class="j-input" type="color" value="#ffffff"></label><label class="j-field"><span data-t="opacity"></span><input id="shapeOpacity" type="range" min="0" max="100" value="40"></label></div><p class="j-note" data-t="brandHint"></p></section></aside>
</main><footer><span id="status" role="status" data-t="ready"></span><progress id="progress" value="0" max="100" hidden></progress><button id="cancelJob" class="j-btn" data-t="cancel" hidden></button><a class="j-credit" href="https://www.linkedin.com/in/jonaschlegelmilch/">Created by Jona Fynn Schlegelmilch</a></footer>
<dialog id="lookDialog" class="j-dialog"></dialog>
<dialog id="exportDialog" class="j-dialog"><form id="exportForm" class="j-stack"><h2 data-t="export"></h2><p class="j-muted" data-t="exportHint"></p><label class="j-field"><span data-t="format"></span><select id="format" class="j-input"><option value="jpg">JPG</option><option value="png">PNG</option></select></label><label class="j-field"><span data-t="quality"></span><input id="quality" type="range" min="50" max="100" value="94"><output id="qualityValue">94%</output></label><label class="j-field"><span data-t="size"></span><select id="size" class="j-input"><option value="0" data-t="originalSize"></option><option value="3840">3840 px</option><option value="2560">2560 px</option><option value="1920">1920 px</option><option value="1280">1280 px</option></select></label><label class="j-field"><span data-t="background"></span><input id="background" type="color" value="#ffffff" class="j-input"></label><label class="j-field"><span data-t="prefix"></span><input id="prefix" class="j-input" maxlength="60"></label><p id="exportSummary" class="j-note"></p><div class="j-dialog-actions"><button type="button" class="j-btn" data-close="exportDialog" data-t="cancel"></button><button type="submit" class="j-btn j-btn-primary" data-t="chooseExport"></button></div></form></dialog>
<dialog id="templateDialog" class="j-dialog"><div class="j-stack"><h2 data-t="templates"></h2><p class="j-muted" data-t="templateHint"></p><label class="j-field"><span data-t="templateName"></span><input id="templateName" class="j-input" maxlength="60"></label><button id="templateSave" class="j-btn j-btn-primary" data-t="templateSave"></button><div id="templateList"></div><p id="templateStatus" role="status"></p><div class="j-dialog-actions"><button class="j-btn" data-close="templateDialog" data-t="close"></button></div></div></dialog>
<script src="kit/jano.js"></script><script src="kit/look-locales.js"></script><script src="kit/looks.js"></script><script src="kit/interactions.js"></script><script src="locales.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
